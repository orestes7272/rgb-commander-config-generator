<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <g id="ring" fill="none" stroke-linecap="round">
      <circle cx="32" cy="32" r="20" stroke="#ff2d4a" stroke-dasharray="32.1 93.6" transform="rotate(-136 32 32)"/>
      <circle cx="32" cy="32" r="20" stroke="#22d46e" stroke-dasharray="32.1 93.6" transform="rotate(-16 32 32)"/>
      <circle cx="32" cy="32" r="20" stroke="#2f7bff" stroke-dasharray="32.1 93.6" transform="rotate(104 32 32)"/>
