  <g fill="none" stroke-linecap="round" stroke-width="4.5">
    <circle cx="32" cy="32" r="20" stroke="#ff6b7f" stroke-dasharray="32.1 93.6" transform="rotate(-136 32 32)"/>
    <circle cx="32" cy="32" r="20" stroke="#6cf0a4" stroke-dasharray="32.1 93.6" transform="rotate(-16 32 32)"/>
    <circle cx="32" cy="32" r="20" stroke="#6ea3ff" stroke-dasharray="32.1 93.6" transform="rotate(104 32 32)"/>
