<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- The Neon Ring mark: red, green and blue LED arcs around a lit button. favicon.svg is the same mark on a tile. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-width="16">
    <circle cx="100" cy="100" r="70" stroke="#ff2d4a" stroke-dasharray="122.2 317.6" transform="rotate(-140 100 100)"/>
    <circle cx="100" cy="100" r="70" stroke="#22d46e" stroke-dasharray="122.2 317.6" transform="rotate(-20 100 100)"/>
    <circle cx="100" cy="100" r="70" stroke="#2f7bff" stroke-dasharray="122.2 317.6" transform="rotate(100 100 100)"/>
    <circle cx="100" cy="100" r="30" stroke="#ffffff" stroke-width="10" opacity=".6"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="9">
    <circle cx="100" cy="100" r="70" stroke="#ff6b7f" stroke-dasharray="122.2 317.6" transform="rotate(-140 100 100)"/>
    <circle cx="100" cy="100" r="70" stroke="#6cf0a4" stroke-dasharray="122.2 317.6" transform="rotate(-20 100 100)"/>
    <circle cx="100" cy="100" r="70" stroke="#6ea3ff" stroke-dasharray="122.2 317.6" transform="rotate(100 100 100)"/>
    <circle cx="100" cy="100" r="30" stroke="#f4f5f8" stroke-width="6"/>
  </g>
</svg>
