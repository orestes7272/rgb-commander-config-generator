<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0d11" />
    <title>RGBcommander Studio</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- use-credentials: the manifest has to get through basic auth too -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="icon-256.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/editor" aria-label="RGBcommander Studio">
        <img class="brand-mark" src="favicon.svg" alt="" width="28" height="28" />
        <span class="brand-name">RGBcommander <b>Studio</b></span>
      </a>
      <nav id="nav" class="nav" aria-label="Main"></nav>
    </header>
    <main id="app"></main>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
